[project]
name = "handshake"
version = "0.1.0"
description = "ADK buyer vs Pydantic AI seller negotiating over A2A with a deterministic referee"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.2.0",
    "a2a-sdk[http-server]==0.3.26",
    "pydantic-ai-slim[openai]==1.107.0",
    "pydantic",
    "typer",
    "httpx",
    "uvicorn",
    "litellm>=1.111.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/handshake"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-m 'not smoke' --cov=handshake --cov-fail-under=80"
filterwarnings = [
    "ignore:.*\\[EXPERIMENTAL\\].*:UserWarning",
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
]
markers = ["smoke: live-LLM smoke tests, excluded by default"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]
